plugins:
  - search
  - redirects
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Godot player, editor-first: a `.sspj` dropped on the SS Importer dock is converted to
        `.ssab`, and dropping that into the 2D viewport makes a `SpriteStudioPlayer2D` that plays
        it, with no code. The API pages list the main methods; the complete members of every node
        and resource are in the editor's own class reference (Help > Search Help), which this file
        does not include.
      sections:
        Using the Player:
          - index.md: "What the player is, its key features, a data-flow diagram from `.sspj` to playback, the supported Godot Engine and SpriteStudio versions, and the related repositories."
          - setup/install.md: "The GDExtension from a release ZIP: copy its `addons` folder into the project root and restart the editor, then continue by whether you already have an `.ssab`. The custom-module build is in the Build Guide."
          - workflow/usage_asset_pipeline.md: "Converting a `.sspj` by dropping it on the SS Importer dock (the output folder, `res://ssab_generated`), then the loop of **Open SSPJ**, editing in SpriteStudio and **Reconvert**, also from the FileSystem dock's right-click menu. Sharing `.ssplayer_sources.cfg` in a team, re-linking a moved `.sspj`, and no Open SSPJ button on Linux."
          - workflow/usage_basic.md: "Placing an `.ssab` in a scene (drag it into the 2D view, or add `SpriteStudioPlayer2D` and set `Ssab`), the main Inspector properties (`Current Animation`, `Autoplay`, `Loop Count`, `Speed Scale`), the bottom-panel preview with its shortcuts, and mask parts."
          - workflow/usage_scripting.md: "The GDScript API: `set_animation()`, `play()`, `pause()`, `resume()` and the three playback states, what an animation change keeps, signals (`animation_finished`, `animation_looped`, `user_data`, `signal_emitted`), `set_cellmap_texture()` for outfit swaps, `SpriteStudioPartAttachment2D` and `get_part_transform()` for following a part, and part color, cell and visibility overrides with their `blend_op` and `priority` values."
          - workflow/motion_blending.md: "Stacking animations on tracks: overlays with `set_track_animation()` and `set_track_alpha()`, additive tracks, `crossfade()` and `fade_track()`, mixing by weight on one track, `set_track_sync()` to start in phase, per-track speed and loop count, which source fires events, and the limits."
          - workflow/ui_buttons.md: "`SpriteStudioButton`, an animation as a Godot button: a section of the animation per state from labels (`normal`, `hover`, `pressed`, `disabled`, `focused`, and `selected_` for toggles), `state_clips`, fitting the artwork, clicks only on `hit_parts`, `reduced_motion`, and `accessibility_name`."
          - workflow/audio.md: "Sound from the audio keys: the built-in playback and its properties (`play_audio`, `audio_volume`, `audio_bus`), what fire-and-forget means (forward only, nothing on a seek, re-fires overlap), observing the `audio` signal and its payload, and routing sound to your own audio stack with a `SpriteStudioAudioBackend`."
          - workflow/animation_player.md: "Driving a `SpriteStudioPlayer2D` from an `AnimationPlayer`: generating the `_anims.res` library with **Gen AnimLib**, setting `Root Node`, regenerating after the animations change, call-method tracks, `AnimationTree` state machines and cutscenes."
          - workflow/export.md: "What this plugin adds to an export: the ETC2/ASTC setting for mobile, and for Web **Extensions Support**, the dlink export templates, single thread (`nothread`), the SIMD requirement and the startup error about GDExtension libraries not being supported. The custom-module build needs none of the Web steps."
          - workflow/generated_assets.md: "What conversion writes (`.ssab`, `.ssqb`, images, `sound/`) and which SpriteStudio edit changes which file, how the files depend on each other, the export modes and which of them ship the files, what a reconvert overwrites or leaves stale, and shipping updates as a `.pck`, including an images-only patch."
          - workflow/import.md: "Converting without the editor, for CI and batch work: taking `ssconverter-cli` from the SDK release that matches the importer's converter version, running it on a `.sspj`, and copying the whole output folder into `res://`."
          - workflow/verify_playback.md: "Checking from a script, without opening the editor, that an `.ssab` loads and plays: a `--headless` smoke test decided by a `SMOKE PASS` line, a snapshot script that saves a PNG of a frame, the first `--import`, and why the exit status misleads. For CI and coding assistants."
          - workflow/tips.md: "`Frame Skip Enabled` and `Sub Frame Enabled`, the `Manual` process mode with `advance(delta)`, skipping off-screen players with `VisibleOnScreenEnabler2D` and `get_canvas_rect()`, the per-part add-on shaders (`ss-sepia`, `ss-hsb`, `ss-outline` and others) and their draw-call cost, a shader over the whole animation through a `CanvasGroup`, and why SSQB sequences are not played."
          - api/player.md: "The playback node's main methods and properties: section and label queries, part queries (`get_part_quad()`, `hit_test_part()`), the authored canvas, part overrides and their constants, track and crossfade methods, signals and their payload fields, audio members, and driving `frame_no` from an `AnimationPlayer`."
          - api/resource.md: "`SSABResource` and `SSQBResource`: sharing one resource between players, `load_from_file()` and `data`, animation, cell map and cell names, `get_canvas_rect()` by animation name, `get_sound_stream()` and `get_sound_info()`. An `.ssqb` loads but no node plays it."
          - troubleshooting.md: "Organised by cause: the node missing from the Create New Node list, nothing drawing (unknown animation name, invalid `.ssab`, missing textures, off screen), a missing part, playback that misbehaves (`animation_finished` never firing, an override not showing, events skipped after a seek), no sound, the editor integration, and Web export errors."
          - limitations.md: "What is not supported or only partly: Text and 9-slice parts, blend modes that fall back to Mix, the limit of 96 masks, how the node differs from `Sprite2D` (selecting in the 2D editor, its Material), notes per platform, Web (single thread, SIMD, dlink), and the seek and reverse limits. The limitations every player shares are on the portal."
          - migration_from_v1.md: "Moving from v1.x: `.sspj` files out of the project and converted to `.ssab`, `GdNodeSsPlayer` replaced by `SpriteStudioPlayer2D`, `set_loop()` replaced by `set_loop_count()`, the renamed and removed methods, and the changed signals."
        For Player & SDK Developers:
          - development/build.md: "Building the GDExtension and the custom-module engine: getting the source, `download-sdk` and `build-runtime`, `build-extension`, `build.sh`, the per-platform release scripts, using a changed build in a project, debugging, export testing for Web, Android and iOS, checking against the real host from a script, and the steps for SDK developers."
          - development/architecture.md: "The player's layers, how one copy of the C++ builds as a GDExtension and as a custom module, and the reasons behind the design: masks as a bitmap, the button wrapping a player, pooled sound voices, and why Text and 9-slice parts are not drawn."
        License:
          - license.md: "The player's license text: the conditions for redistributing source and binary forms, and the disclaimer of warranty."
          - third_party_notices.md: "Notices for the third-party libraries the player uses (FlatBuffers, godot-cpp, SpriteStudio-SDK), and where the licenses of the Rust runtime's dependencies are in a build and in a release package."

