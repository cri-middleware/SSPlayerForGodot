INHERIT: ./mkdocs.base.yml

docs_dir: docs/ja
site_dir: site/ja
site_url: "https://cri-middleware.github.io/SSPlayerForGodot/ja/"
site_description: "SpriteStudio のアニメーションを Godot Engine で再生するプラグイン"

theme:
  language: ja

extra:
  site_root_prefix: "../"
  social:
    - icon: material/motion-play
      link: https://cri-middleware.github.io/SpriteStudio-Docs/ja/
      name: SpriteStudio Docs（ポータル）
    - icon: fontawesome/brands/github
      link: https://github.com/cri-middleware
      name: GitHub の cri-middleware
    - icon: material/web
      link: https://www.webtech.co.jp/spritestudio/
      name: SpriteStudio
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/spritestudio
      name: X の SpriteStudio

plugins:
  - search
  - redirects
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        エディタ中心の Godot 用 Player です。`.sspj` を SS Importer ドックにドロップすると `.ssab` に変換され、それを 2D ビューポートにドロップすれば、`SpriteStudioPlayer2D` がコードなしで再生します。API のページには主なメソッドを載せています。各ノードとリソースのメンバーの全体は、エディタ内蔵のクラスリファレンス（ヘルプ > ヘルプを検索）にあり、このファイルには含まれません。
      sections:
        Player の使い方:
          - index.md: "この Player の概要、主な機能、`.sspj` から再生までのデータの流れの図、対応する Godot Engine と SpriteStudio のバージョン、関連リポジトリ。"
          - setup/install.md: "リリースの ZIP から GDExtension を導入する手順。`addons` フォルダをプロジェクトのルートにコピーしてエディタを再起動し、`.ssab` を持っているかどうかで次のページへ進む。カスタムモジュール版はビルドガイドにある。"
          - workflow/usage_asset_pipeline.md: "`.sspj` を SS Importer ドックにドロップして変換する初回の手順（出力先は `res://ssab_generated`）と、そのあとの往復。**Open SSPJ** で SpriteStudio を開いて編集し、**Reconvert** で戻す。ファイルシステムドックの右クリックメニューからもできる。チーム開発での `.ssplayer_sources.cfg` の共有、移動した `.sspj` の再リンク、Linux では Open SSPJ が出ないこと。"
          - workflow/usage_basic.md: "`.ssab` をシーンに置いて再生する手順。2D ビューへのドラッグ＆ドロップ、または `SpriteStudioPlayer2D` を追加して `Ssab` を設定する方法、主なインスペクタープロパティ（`Current Animation`、`Autoplay`、`Loop Count`、`Speed Scale`）、下部パネルでのプレビューとショートカット、マスクパーツへの対応。"
          - workflow/usage_scripting.md: "GDScript から使う API。`set_animation()`・`play()`・`pause()`・`resume()` と 3 つの再生状態、アニメーション切り替えで残る設定、シグナル（`animation_finished`、`animation_looped`、`user_data`、`signal_emitted`）、着せ替えのための `set_cellmap_texture()`、パーツに追従する `SpriteStudioPartAttachment2D` と `get_part_transform()`、パーツの色・セル・表示の上書きと `blend_op`・`priority` の値。"
          - workflow/motion_blending.md: "アニメーションをトラックに重ねる方法。`set_track_animation()` と `set_track_alpha()` によるオーバーレイ、加算トラック、`crossfade()` と `fade_track()`、1 つのトラックで重みを付けて混ぜる方法、`set_track_sync()` で位相をそろえて始めること、トラックごとの速度とループ回数、どのソースがイベントを発火するか、制約。"
          - workflow/ui_buttons.md: "`SpriteStudioButton` でアニメーションを Godot のボタンにする。状態ごとにラベルから再生する区間（`normal`・`hover`・`pressed`・`disabled`・`focused`、トグルの `selected_`）、`state_clips`、絵の収め方、`hit_parts` による絵の上でだけのクリック、`reduced_motion`、`accessibility_name`。"
          - workflow/audio.md: "サウンドキーの再生。組み込みの再生とそのプロパティ（`play_audio`、`audio_volume`、`audio_bus`）、撃ちっぱなし（fire-and-forget）の性質（順方向のみ、シークでは鳴らない、再発火は重なる）、`audio` シグナルとその payload での観測、`SpriteStudioAudioBackend` による自前のオーディオ基盤への振り分け。"
          - workflow/animation_player.md: "`AnimationPlayer` から `SpriteStudioPlayer2D` を動かす方法。**Gen AnimLib** での `_anims.res` の生成、`Root Node` の設定、アニメーションを変えたあとの作り直し、Call Method トラック・`AnimationTree` のステートマシン・カットシーン。"
          - workflow/export.md: "この Player がエクスポートに加える手順。モバイル向けの ETC2/ASTC の設定、Web の **Extensions Support**・dlink 対応のエクスポートテンプレート・シングルスレッド（`nothread`）・SIMD の要件、起動時の GDExtension 非対応のエラー。カスタムモジュール版は Web の手順が要らない。"
          - workflow/generated_assets.md: "変換が書き出すファイル（`.ssab`、`.ssqb`、画像、`sound/`）と、SpriteStudio での編集ごとに変わるファイル、ファイル同士の依存関係、エクスポートモードとそれぞれで同梱されるもの、再コンバートで上書きされるものと古いまま残るもの、`.pck` での追加配信（画像だけの差し替えを含む）。"
          - workflow/import.md: "エディタを使わない変換。CI や一括変換向け。SDK のリリースから、インポータの converter と同じ版の `ssconverter-cli` を取得して `.sspj` に実行し、出力フォルダごと `res://` へコピーする。"
          - workflow/verify_playback.md: "エディタを開かずに、スクリプトから `.ssab` が読み込めて再生されることを確かめる方法。`SMOKE PASS` の行で判定する `--headless` のスモークテスト、フレームの PNG を保存するスナップショットのスクリプト、最初の `--import`、終了ステータスが当てにならない理由。CI やコーディングアシスタント向け。"
          - workflow/tips.md: "`Frame Skip Enabled` と `Sub Frame Enabled`、`advance(delta)` で自分で進める `Manual` モード、`VisibleOnScreenEnabler2D` と `get_canvas_rect()` による画面外のプレイヤーの省略、パーツ単位のアドオンシェーダ（`ss-sepia`、`ss-hsb`、`ss-outline` など）と描画コスト、`CanvasGroup` によるアニメーション全体へのシェーダ、SSQB のシーケンスが再生されない理由。"
          - api/player.md: "再生ノードの主なメソッドとプロパティ。再生区間とラベルの参照、パーツの参照（`get_part_quad()`、`hit_test_part()`）、オーサリング時のキャンバス、パーツオーバーライドとその定数、トラックとクロスフェードのメソッド、シグナルと payload のフィールド、サウンドのメンバー、`AnimationPlayer` からの `frame_no` の駆動。"
          - api/resource.md: "`SSABResource` と `SSQBResource`。1 つのリソースを複数のプレイヤーで共有すること、`load_from_file()` と `data`、アニメーション・セルマップ・セルの名前、アニメーション名で引く `get_canvas_rect()`、`get_sound_stream()` と `get_sound_info()`。`.ssqb` は読み込めるが、再生するノードはない。"
          - troubleshooting.md: "原因別の構成。「新規ノードを作成」の一覧にノードが無い、何も描画されない（存在しないアニメーション名、不正な `.ssab`、テクスチャが無い、画面外）、特定のパーツだけ欠ける、再生の挙動がおかしい（`animation_finished` が来ない、上書きが反映されない、シーク後にイベントが飛ぶ）、音が鳴らない、エディタ連携が動かない、Web エクスポートのエラー。"
          - limitations.md: "対応していないもの、一部だけ対応しているもの。テキストパーツと 9 スライスパーツ、Mix にフォールバックする合成モード、96 個までのマスク、`Sprite2D` との違い（2D エディタでの選択、ノードのマテリアル）、プラットフォームごとの注意、Web（シングルスレッド、SIMD、dlink）、シークと逆再生の制約。全 Player に共通する制約はポータルにある。"
          - migration_from_v1.md: "v1.x からの移行。`.sspj` をプロジェクトの外へ出して `.ssab` に変換すること、`GdNodeSsPlayer` から `SpriteStudioPlayer2D` への置き換え、`set_loop()` から `set_loop_count()` への変更、名前が変わった・廃止されたメソッド、変わったシグナル。"
        Player・SDK 開発者向けガイド:
          - development/build.md: "GDExtension とカスタムモジュール入りエンジンのビルド。ソースの取得、`download-sdk` と `build-runtime`、`build-extension`、`build.sh`、プラットフォームごとのリリーススクリプト、変更した版をプロジェクトで使う方法、デバッグ、Web・Android・iOS でのエクスポートの確認、スクリプトから実際のホストで確かめる方法、SDK 開発者向けの手順。"
          - development/architecture.md: "Player の層構成、1 つの C++ のソースを GDExtension とカスタムモジュールの両方にビルドする仕組み、この作りになっている理由。マスクをビットマップで扱うこと、プレイヤーを包むボタン、プールしたサウンドのボイス、テキストパーツと 9 スライスパーツを描画しない理由。"
        ライセンス:
          - license.md: "この Player のライセンス条文（BSD 3-Clause License の参考訳。正文は英語版）。"
          - third_party_notices.md: "この Player が使うサードパーティライブラリ（FlatBuffers、godot-cpp、SpriteStudio-SDK）のライセンス表記と、Rust ランタイムの依存ライブラリのライセンスの置き場所（ビルドした場合と、リリースパッケージの場合）。"

